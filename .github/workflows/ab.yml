name: ab

# On-demand A/B run (issue: on-demand CI run of the A/B tool): automates
# dev.md "The PR procedure, and what gates" step 1 — `just ab --aa`, then
# `just ab` — and posts both reports. Deliberately NOT on push/pull_request:
# the deterministic per-case signal already rides every CI run via the
# coverage gate's csar-ab invocations, and standing timing runs on hosted
# runners would only accumulate noise. Trigger with:
#   gh workflow run ab --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    # ubuntu-latest, unpinned: the A/A calibration runs in-band, so image
    # churn shows up as a changed floor in the same report rather than
    # silently invalidating a stored one — the image choice is not
    # load-bearing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: ab
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false # nothing to cache: the script declares no deps
      # --aa first, then the A/B — the calibration is what makes the A/B
      # interpretable, and both come from the same binary in the same job.
      # Explicit bash for pipefail: the default shell would let tee's exit 0
      # mask a failed run, and the next step would post the truncated report
      # as if it were evidence.
      - name: Run the A/A calibration, then the A/B
        shell: bash
        run: |
          just ab --aa | tee aa-report.txt
          just ab | tee ab-report.txt
      - name: Post both reports
        # All logic in scripts/ab_comment.py — also runnable locally to
        # produce the same block for a manual PR-body paste.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run scripts/ab_comment.py
