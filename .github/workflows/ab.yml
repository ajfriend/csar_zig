name: ab

# The A/B run: automates dev.md "The PR procedure, and what gates" step 1 —
# `just ab --aa`, then `just ab` — and posts both reports as a PR comment.
# Runs on every PR that touches the report's inputs (the paths mirror the
# procedure's own scope rule: docs-class PRs skip), so the gate's bit-exact
# diff is self-enforcing rather than author-remembered; the test suite's
# 1e-6 pins never covered that. CI *timing* stays coarse — between-session
# runner variance is ~10x the within-run A/A floor (samples: #22) — so a
# CI-only ratio shift needs a second dispatch or a local run before it is
# named in a PR body. For a branch without a PR (e.g. main):
#   gh workflow run ab --ref <branch>
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'bench/**'
      - 'cases/**'
      - 'build.zig'
      - 'build.zig.zon'
      # The delivery mechanism itself: a change to it should prove it runs.
      - '.github/workflows/ab.yml'
      - 'scripts/ab_comment.py'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ab:
    # ubuntu-latest, unpinned: the A/A calibration runs in-band, so image
    # churn shows up as a changed floor in the same report rather than
    # silently invalidating a stored one — the image choice is not
    # load-bearing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          cache-key: ab
      - uses: extractions/setup-just@v3
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false # nothing to cache: the script declares no deps
      # --aa first, then the A/B — the calibration is what makes the A/B
      # interpretable, and both come from the same binary in the same job.
      # Explicit bash for pipefail: the default shell would let tee's exit 0
      # mask a failed run, and the next step would post the truncated report
      # as if it were evidence.
      - name: Run the A/A calibration, then the A/B
        shell: bash
        run: |
          just ab --aa | tee aa-report.txt
          just ab | tee ab-report.txt
      - name: Post both reports
        # All logic in scripts/ab_comment.py — also runnable locally to
        # produce the same block for a manual PR-body paste.
        env:
          GH_TOKEN: ${{ github.token }}
          # On pull_request the event names the PR (the ref is N/merge, so a
          # branch lookup can't); empty under workflow_dispatch, where the
          # script resolves the branch's open PR instead.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run scripts/ab_comment.py
