name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build
        run: zig build
      - name: Test (including slow stress tests, LLVM backend)
        run: zig build test -Dslow=true
      - name: Test (self-hosted backend)
        # Same suite, same iteration-ceiling bounds, zig's self-hosted
        # codegen. Coverage below still measures the LLVM binary only.
        run: zig build test -Dslow=true -Dllvm=false
      - uses: extractions/setup-just@v3
      - name: Cache kcov
        id: kcov-cache
        uses: actions/cache@v4
        with:
          path: ~/kcov
          key: kcov-v43-${{ runner.os }}-${{ runner.arch }}
      - name: Build kcov
        # kcov is not in ubuntu-latest's apt repos and publishes no
        # binaries; build v43 (matching the local version) from source.
        if: steps.kcov-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-dev libdw-dev libelf-dev libcurl4-openssl-dev cmake
          git clone --depth 1 --branch v43 https://github.com/SimonKagstrom/kcov /tmp/kcov-src
          cmake -S /tmp/kcov-src -B /tmp/kcov-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/kcov"
          cmake --build /tmp/kcov-build -j"$(nproc)"
          cmake --install /tmp/kcov-build
      - name: Coverage gate + exclusion ledger
        run: |
          set -euo pipefail  # a failing gate must fail this step despite the tee
          # runtime libs for the (possibly cache-restored) kcov binary
          sudo apt-get update -qq
          sudo apt-get install -y -qq libdw1t64 || sudo apt-get install -y -qq libdw1
          export PATH="$HOME/kcov/bin:$PATH"
          kcov --version
          just test-slow 2>&1 | tee gate.log
          { echo '### Coverage'; echo '```'; sed -n '/^csar coverage:/,$p' gate.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post exclusion ledger on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '**Coverage exclusion ledger** (ubuntu CI; see dev.md "Coverage exclusions"):'
            echo '```'
            sed -n '/^csar coverage:/,$p' gate.log
            echo '```'
          } > ledger-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body-file ledger-comment.md ||
            gh pr comment "${{ github.event.pull_request.number }}" --body-file ledger-comment.md
