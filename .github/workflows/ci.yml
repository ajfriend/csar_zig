name: ci

# A bare `push:` alongside `pull_request:` runs every PR commit twice: both
# events fire for a same-repo branch, and the concurrency group below can't
# dedupe them (github.ref is refs/heads/<branch> for one and refs/pull/N/merge
# for the other). Restricting push to main gives each commit exactly one run —
# PRs via pull_request, main (including merge commits) via push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per `just ci` recipe, in parallel, so wall time is the slowest
# recipe rather than the sum. What each recipe does: `just --list`, dev.md.
jobs:
  just:
    strategy:
      fail-fast: false # one recipe failing must not cancel the others
      matrix:
        recipe: [check, lint, consumer-smoke, test-selfhosted]
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # One cache per recipe — setup-zig's default key is the job id,
          # shared by all four matrix entries.
          cache-key: ${{ matrix.recipe }}
      - uses: extractions/setup-just@v3
      - run: just ${{ matrix.recipe }}

  # `just test-slow`: the LLVM-backend suite under kcov (dev.md "Two backends").
  coverage:
    # Pinned, not ubuntu-latest (24.04): apt has no kcov for noble, which
    # would force a slow brew install (dev.md "Dependencies"). Revert to
    # ubuntu-latest once it maps to 26.04 or later — apt kcov stays valid
    # there. 26.04 is a *preview* image; if it churns, revert the pin (only
    # the apt step depends on it).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: extractions/setup-just@v3
      # No moving major tag past v7, so pin the exact release. Caching is off
      # because there is nothing to cache: coverage_gate.py declares no
      # dependencies, so `auto` stores an empty entry that never invalidates
      # and warns on every run.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Install kcov
        # No `apt-get update`: the image's baked lists resolve kcov, and the
        # update was this step's whole mirror-dependent cost (#47). If the
        # lists ever go stale this fails loudly — reinstate it then.
        # `kcov --version` is the string the gate's report header carries.
        run: |
          sudo apt-get install -y kcov
          kcov --version
      - run: just test-slow
      - name: Upload the gate's log
        # Every kcov invocation's output — for when CI's ledger disagrees
        # with a local run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-log
          path: zig-out/test-slow.log
          if-no-files-found: ignore
      - name: Post the gate's report
        # To the step summary, and on a PR as a comment — green or red, since
        # a failing gate is when the report matters most. No report means the
        # gate never measured (build failure, or its own precondition check);
        # then the previous comment stands, stale, but the job is red.
        if: always() && hashFiles('coverage/summary.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on a push to main: the script then writes the summary only.
          PR_NUMBER: ${{ github.event.pull_request.number }}
        # The report names the kcov build; the script names the image too,
        # the other thing that can move kcov's line classification and so
        # the ledger. Upsert by marker, not --edit-last: rationale in
        # scripts/gate_comment.py.
        run: uv run scripts/gate_comment.py
