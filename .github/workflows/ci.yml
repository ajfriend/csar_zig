name: ci

# A bare `push:` alongside `pull_request:` runs every PR commit twice: both
# events fire for a same-repo branch, and the concurrency group below can't
# dedupe them (github.ref is refs/heads/<branch> for one and refs/pull/N/merge
# for the other). Restricting push to main gives each commit exactly one run —
# PRs via pull_request, main (including merge commits) via push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per `just ci` recipe, in parallel: wall time is the longest job
# (lint and coverage, ~80s each) rather than the sum (~3 min). Each job sets
# up zig itself (~10s). What each recipe does: `just --list`, dev.md.
#
# Pinned, not ubuntu-latest (24.04), for `coverage`: apt has no kcov for
# noble, which would force a slow brew install (dev.md "Dependencies"). Revert
# to ubuntu-latest once it maps to 26.04 or later — apt kcov stays valid
# there. 26.04 is a *preview* image; if it churns, revert the pin (only the
# apt step depends on it).
jobs:
  just:
    strategy:
      fail-fast: false # one recipe failing must not cancel the others
      matrix:
        recipe: [check, lint, consumer-smoke, test-selfhosted]
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # consumer-smoke compiles in $TMPDIR, outside the cached dir.
          use-cache: ${{ matrix.recipe != 'consumer-smoke' }}
      - uses: extractions/setup-just@v3
      - name: DIAGNOSTIC (temporary) — what the restored zig cache serves
        run: |
          echo "== restored cache: $(du -sh .zig-cache 2>/dev/null | cut -f1) in $ZIG_LOCAL_CACHE_DIR"
          case "${{ matrix.recipe }}" in
            lint)  (cd lint && time zig build lint --summary all) ;;
            check) time zig build check --summary all; time zig build --build-file bench/build.zig check --summary all ;;
            *)     just ${{ matrix.recipe }} ;;
          esac

  # The LLVM-backend suite, under kcov: `just test-slow` is both.
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: extractions/setup-just@v3
      # No moving major tag past v7, so pin the exact release. Caching is off
      # because there is nothing to cache: coverage_gate.py declares no
      # dependencies, so `auto` stores an empty entry that never invalidates
      # and warns on every run.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Install kcov
        run: sudo apt-get update -qq && sudo apt-get install -y kcov
      - name: just test-slow
        run: |
          set -euo pipefail
          kcov --version
          just test-slow
          { echo '### Coverage'; cat coverage/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the gate's log
        # Every kcov invocation's output — for when CI's ledger disagrees
        # with a local run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-log
          path: |
            zig-out/test-slow.log
            coverage/summary.txt
          if-no-files-found: ignore
      - name: Post exclusion ledger on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Name the image and kcov build: the ledger is derived from kcov's
          # line classification, so if a runner-image change ever moves it,
          # that shows up here next to the ledger it changed.
          { printf '**Coverage exclusion ledger** (%s, %s; see dev.md "Coverage exclusions"):\n' \
              "${ImageOS:-ubuntu}" "$(kcov --version)"
            cat coverage/summary.md
          } > ledger-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file ledger-comment.md
