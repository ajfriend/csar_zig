name: ci

# A bare `push:` alongside `pull_request:` runs every PR commit twice: both
# events fire for a same-repo branch, and the concurrency group below can't
# dedupe them (github.ref is refs/heads/<branch> for one and refs/pull/N/merge
# for the other). Restricting push to main gives each commit exactly one run —
# PRs via pull_request, main (including merge commits) via push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned, not ubuntu-latest (24.04): apt has no kcov for noble, which
    # would force a slow brew install (see dev.md "Dependencies"). Revert to
    # ubuntu-latest once it maps to 26.04 or later — apt kcov stays valid
    # there. 26.04 is a *preview* image; if it churns, revert the whole
    # commit, since the apt step depends on the pin.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: extractions/setup-just@v3
      # No moving major tag past v7, so pin the exact release. Caching is off
      # because there is nothing to cache: coverage_gate.py declares no
      # dependencies, so `auto` stores an empty entry that never invalidates
      # and warns on every run.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      - name: Build
        run: just check
      - name: Lint (every declaration referenced)
        run: just lint
      - name: Consumer smoke (the package as shipped through .paths)
        run: just consumer-smoke
      - name: Test (self-hosted backend)
        # See dev.md "Two backends". The LLVM-backend suite runs below,
        # under the coverage gate.
        run: just test-selfhosted
      - name: Install kcov
        run: sudo apt-get update -qq && sudo apt-get install -y kcov
      - name: Test (LLVM backend) + coverage gate + exclusion ledger
        run: |
          set -euo pipefail
          kcov --version
          just test-slow
          { echo '### Coverage'; cat coverage/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: DIAGNOSTIC (temporary) — kcov master, and the self-hosted backend
        if: always()
        run: |
          set +e
          echo "== A. kcov built from master"
          sudo apt-get install -y -qq cmake binutils-dev libssl-dev libelf-dev libstdc++-12-dev zlib1g-dev libdw-dev libiberty-dev libcurl4-openssl-dev >/dev/null 2>&1
          git clone -q --depth 1 https://github.com/SimonKagstrom/kcov /tmp/kcov-src && cmake -S /tmp/kcov-src -B /tmp/kcov-build -DCMAKE_BUILD_TYPE=Release >/dev/null 2>&1 && cmake --build /tmp/kcov-build -j >/dev/null 2>&1 && ls -la /tmp/kcov-build/src/kcov
          /tmp/kcov-build/src/kcov --version
          rm -rf /tmp/km; /tmp/kcov-build/src/kcov /tmp/km zig-out/bin/csar-ex-cases hex >/dev/null 2>&1
          python3 -c "import json,glob;d=json.load(open(glob.glob('/tmp/km/csar-ex-cases.*/coverage.json')[0]));print(len(d['files']),'files; root-ish:',[f['file'].split('csar_zig/')[-1] for f in d['files'] if 'examples' in f['file'] or 'cases.zig' in f['file'] or 'root.zig' in f['file']])"
          echo "== B. self-hosted backend build of the example, apt kcov"
          zig build-exe examples/cases.zig --dep csar --dep cases -Mroot=examples/cases.zig -Mcsar=src/root.zig -Mcases=cases/cases.zig -fno-llvm -femit-bin=/tmp/cases-sh 2>&1 | tail -3
          rm -rf /tmp/ks; kcov /tmp/ks /tmp/cases-sh hex >/dev/null 2>&1
          python3 -c "import json,glob;g=glob.glob('/tmp/ks/cases-sh.*/coverage.json');d=json.load(open(g[0])) if g else {'files':[]};print(len(d['files']),'files; root-ish:',[f['file'].split('csar_zig/')[-1] for f in d['files'] if 'examples' in f['file'] or 'cases.zig' in f['file']])"
      - name: Upload the gate's log
        # Every kcov invocation and the per-binary line totals behind the
        # ledger — what you need when the ledger disagrees with a local run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-log
          path: |
            zig-out/test-slow.log
            coverage/summary.txt
          if-no-files-found: ignore
      - name: Post exclusion ledger on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Name the image and kcov build: the ledger is derived from kcov's
          # line classification, so if a runner-image change ever moves it,
          # that shows up here next to the ledger it changed.
          { printf '**Coverage exclusion ledger** (%s, %s; see dev.md "Coverage exclusions"):\n' \
              "${ImageOS:-ubuntu}" "$(kcov --version)"
            cat coverage/summary.md
          } > ledger-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file ledger-comment.md
