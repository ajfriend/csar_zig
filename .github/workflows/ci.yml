name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 26.04 (not ubuntu-latest, which is 24.04) for apt's kcov: the archive
    # skips noble entirely, so 24.04 forced a brew install that poured 27
    # dependencies for a 1.5 MB tool — ~45s of a ~90s job. 26.04 ships
    # kcov 43, the same version dev.md pins locally.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: extractions/setup-just@v3
      # Exact version: setup-uv stopped publishing moving major tags after v7.
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Build
        run: just check
      - name: Test (self-hosted backend)
        # See dev.md "Two backends". The LLVM-backend suite runs below,
        # under the coverage gate.
        run: just test-selfhosted
      - name: Install kcov
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kcov
      - name: Test (LLVM backend) + coverage gate + exclusion ledger
        run: |
          set -euo pipefail
          kcov --version
          just test-slow
          { echo '### Coverage'; cat coverage/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post exclusion ledger on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '**Coverage exclusion ledger** (ubuntu CI; see dev.md "Coverage exclusions"):'
            cat coverage/summary.md
          } > ledger-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file ledger-comment.md
