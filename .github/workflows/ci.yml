name: ci

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: extractions/setup-just@v3
      - name: Build
        run: just check
      - name: Test (self-hosted backend)
        # See dev.md "Two backends". The LLVM-backend suite runs below,
        # under the coverage gate.
        run: just test-selfhosted
      - name: Install kcov
        # Same channel as the local dev install (the brew formula ships
        # a prebuilt x86_64_linux bottle); the runner image includes
        # linuxbrew.
        run: |
          command -v brew > /dev/null || eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install -q kcov
          command -v uv > /dev/null || brew install -q uv
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Test (LLVM backend) + coverage gate + exclusion ledger
        run: |
          set -euo pipefail
          kcov --version
          just test-slow
          { echo '### Coverage'; cat coverage/summary.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: Post exclusion ledger on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '**Coverage exclusion ledger** (ubuntu CI; see dev.md "Coverage exclusions"):'
            cat coverage/summary.md
          } > ledger-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file ledger-comment.md
