name: ci

# A bare `push:` alongside `pull_request:` runs every PR commit twice: both
# events fire for a same-repo branch, and the concurrency group below can't
# dedupe them (github.ref is refs/heads/<branch> for one and refs/pull/N/merge
# for the other). Restricting push to main gives each commit exactly one run —
# PRs via pull_request, main (including merge commits) via push.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per `just ci` recipe, in parallel, so wall time is the slowest
# recipe rather than the sum. What each recipe does: `just --list`, dev.md.
jobs:
  just:
    strategy:
      fail-fast: false # one recipe failing must not cancel the others
      matrix:
        recipe: [check, lint, consumer-smoke, test-selfhosted]
    name: ${{ matrix.recipe }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          # One cache per recipe — setup-zig's default key is the job id,
          # shared by all four matrix entries.
          cache-key: ${{ matrix.recipe }}
      - uses: extractions/setup-just@v3
      - run: just ${{ matrix.recipe }}

  # `just test-slow`: the LLVM-backend suite under kcov (dev.md "Two backends").
  coverage:
    # Pinned, not ubuntu-latest (24.04): apt has no kcov for noble, which
    # would force a slow brew install (dev.md "Dependencies"). Revert to
    # ubuntu-latest once it maps to 26.04 or later — apt kcov stays valid
    # there. 26.04 is a *preview* image; if it churns, revert the pin (only
    # the kcov steps below depend on it, and their cache key is per-image, so
    # a moving image costs one cold download, not a wrong deb set).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - uses: extractions/setup-just@v3
      # No moving major tag past v7, so pin the exact release. Caching is off
      # because there is nothing to cache: coverage_gate.py declares no
      # dependencies, so `auto` stores an empty entry that never invalidates
      # and warns on every run.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false
      # kcov comes from apt, but `apt-get update && install` costs 8–28 s,
      # mirror-dependent — the job's largest step after the gate itself
      # (issue #47). So fetch the .debs once per runner image and cache them;
      # every later run is a local `dpkg -i` with no network at all. The key
      # carries the image version because the cached set is exactly the
      # dependencies *that image* lacks — no restore-keys, since a deb set
      # picked for one image may not satisfy the next.
      - name: Restore the kcov .debs
        id: kcov-debs
        uses: actions/cache@v4
        with:
          path: ~/kcov-debs
          key: kcov-debs-${{ env.ImageOS }}-${{ env.ImageVersion }}
      - name: Download the kcov .debs
        if: steps.kcov-debs.outputs.cache-hit != 'true'
        run: |
          # apt insists on a `partial` subdir inside its archives dir.
          mkdir -p ~/kcov-debs/partial
          sudo apt-get update -qq
          # --download-only fetches kcov plus whichever of its dependencies
          # the image doesn't already carry, and installs nothing.
          sudo apt-get install -y --download-only \
            -o Dir::Cache::archives="$HOME/kcov-debs/" kcov
          # apt wrote them as root; the cache is saved as the runner user.
          sudo chown -R "$(id -u):$(id -g)" ~/kcov-debs
      - name: Install kcov
        # `kcov --version` both proves the install and is the string the
        # gate's report header carries (dev.md "Coverage") — keep it visible.
        run: |
          sudo dpkg -i ~/kcov-debs/*.deb
          kcov --version
      - run: just test-slow
      - name: Upload the gate's log
        # Every kcov invocation's output — for when CI's ledger disagrees
        # with a local run.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gate-log
          path: zig-out/test-slow.log
          if-no-files-found: ignore
      - name: Post the gate's report
        # To the step summary, and on a PR as a comment — green or red, since
        # a failing gate is when the report matters most. No report means the
        # gate never measured (build failure, or its own precondition check);
        # then the previous comment stands, stale, but the job is red.
        if: always() && hashFiles('coverage/summary.txt') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The report names the kcov build; name the image too, the other
          # thing that can move kcov's line classification and so the ledger.
          { printf '**Coverage gate** (%s; see dev.md "Coverage"):\n```\n' "${ImageOS:-ubuntu}"
            cat coverage/summary.txt
            printf '```\n'
          } > gate-report.md
          cat gate-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --edit-last --create-if-none --body-file gate-report.md
          fi
